name: Build & Publish Patchwing CLI

# 用途：编译 pw 二进制（macOS / Linux / Windows）并上传到 MinIO（CDN）
#
# 触发：
#   - 手动触发（workflow_dispatch）
#   - 推送到 main 且修改了 CLI 源码
#   - 推送 v* tag（用于发布正式版本）
#
# 产物路径（CDN）：
#   https://cdn.patchwing.net/patchwing/cli/<version>/pw-<platform>[.exe]
#   https://cdn.patchwing.net/patchwing/cli/latest/pw-<platform>[.exe]
#
# 必需的 Secrets（在 GitHub repo Settings → Secrets and variables → Actions）：
#   MINIO_ENDPOINT       例如 https://minio.example.com
#   MINIO_ACCESS_KEY
#   MINIO_SECRET_KEY
#   MINIO_BUCKET         默认 patchwing（可选；不设则用 patchwing）

on:
  workflow_dispatch:
    inputs:
      upload_latest:
        description: '是否同步到 latest 目录'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packages/patchwing_cli/**'
      - 'packages/patchwing_code_push_client/**'
      - 'packages/patchwing_code_push_protocol/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-pw-cli.yml'

env:
  CLI_PKG_DIR: packages/patchwing_cli
  WORKSPACE_DIR: .

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Job 1：macOS 编译（darwin-arm64 + darwin-x64）
  # 在 macos-14（Apple Silicon, arm64）单机上完成两个产物：
  #   - darwin-arm64：原生 dart compile exe
  #   - darwin-x64  ：下载 x64 Dart SDK + Rosetta 2，直接产出 x64 Mach-O
  # 注意：dart compile exe --target-arch x64 在 macOS 上不支持，必须走 Rosetta。
  # ──────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build pw (macOS arm64 + x64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Dart SDK（arm64, 原生）
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取 CLI 版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' "${CLI_PKG_DIR}/pubspec.yaml" | awk '{print $2}')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_VERSION="${VERSION}+${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 CLI Version: ${VERSION}"
          echo "🔖 Build Version (注入到二进制): ${BUILD_VERSION}"

      - name: 安装依赖（workspace 根）
        shell: bash
        run: |
          cd "${WORKSPACE_DIR}"
          dart pub get --no-precompile

      # ---- 编译 darwin-arm64（原生） ----
      - name: 编译 darwin-arm64
        shell: bash
        run: |
          mkdir -p build/cli
          dart compile exe "${CLI_PKG_DIR}/bin/patchwing.dart" \
            -o "${{ github.workspace }}/build/cli/pw-darwin-arm64" \
            -D PATCHWING_BUILD_VERSION=${{ steps.version.outputs.build_version }}
          chmod +x build/cli/pw-darwin-arm64
          echo "✅ darwin-arm64 编译完成"
          file build/cli/pw-darwin-arm64

      # ---- 安装 Rosetta 2（用于 x64 Dart SDK） ----
      - name: 安装 Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: 下载与本机同版本的 x64 Dart SDK
        shell: bash
        run: |
          DART_VERSION=$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "当前 Dart 版本: ${DART_VERSION}"
          curl -sSL "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-macos-x64-release.zip" \
            -o /tmp/dart-x64.zip
          unzip -q /tmp/dart-x64.zip -d /tmp/dart-x64
          echo "✅ x64 Dart SDK 下载完成"
          file /tmp/dart-x64/dart-sdk/bin/dart

      - name: 编译 darwin-x64（Rosetta 2 + x64 Dart SDK）
        shell: bash
        run: |
          # 先用 x64 Dart SDK 重做一次 pub get（保证 .dart_tool 与 x64 SDK 兼容）
          /tmp/dart-x64/dart-sdk/bin/dart pub get --no-precompile
          /tmp/dart-x64/dart-sdk/bin/dart compile exe "${CLI_PKG_DIR}/bin/patchwing.dart" \
            -o "${{ github.workspace }}/build/cli/pw-darwin-x64" \
            -D PATCHWING_BUILD_VERSION=${{ steps.version.outputs.build_version }}
          chmod +x build/cli/pw-darwin-x64
          echo "✅ darwin-x64 编译完成"
          file build/cli/pw-darwin-x64

      - name: 上传 darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: pw-darwin-arm64
          path: build/cli/pw-darwin-arm64
          retention-days: 7

      - name: 上传 darwin-x64
        uses: actions/upload-artifact@v4
        with:
          name: pw-darwin-x64
          path: build/cli/pw-darwin-x64
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Job 2：Linux x64 编译（原生）
  # ──────────────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build pw (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取 CLI 版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' "${CLI_PKG_DIR}/pubspec.yaml" | awk '{print $2}')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_VERSION="${VERSION}+${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 安装依赖（workspace 根）
        shell: bash
        run: |
          cd "${WORKSPACE_DIR}"
          dart pub get --no-precompile

      - name: 编译 linux-x64
        shell: bash
        run: |
          mkdir -p build/cli
          dart compile exe "${CLI_PKG_DIR}/bin/patchwing.dart" \
            -o "${{ github.workspace }}/build/cli/pw-linux-x64" \
            -D PATCHWING_BUILD_VERSION=${{ steps.version.outputs.build_version }}
          chmod +x build/cli/pw-linux-x64
          echo "✅ linux-x64 编译完成"
          file build/cli/pw-linux-x64

      - name: 上传 linux-x64
        uses: actions/upload-artifact@v4
        with:
          name: pw-linux-x64
          path: build/cli/pw-linux-x64
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Job 3：Linux arm64 编译（Docker + QEMU 模拟）
  # ──────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build pw (linux-arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 QEMU（用于 arm64 模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 获取 CLI 版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' "${CLI_PKG_DIR}/pubspec.yaml" | awk '{print $2}')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_VERSION="${VERSION}+${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 编译 linux-arm64（Docker QEMU）
        shell: bash
        run: |
          mkdir -p build/cli
          docker run --rm \
            --platform linux/arm64 \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            dart:stable \
            bash -c "dart pub get --no-precompile && dart compile exe ${CLI_PKG_DIR}/bin/patchwing.dart -o build/cli/pw-linux-arm64 -D PATCHWING_BUILD_VERSION=${{ steps.version.outputs.build_version }} && chmod +x build/cli/pw-linux-arm64"
          echo "✅ linux-arm64 编译完成"
          file build/cli/pw-linux-arm64

      - name: 上传 linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: pw-linux-arm64
          path: build/cli/pw-linux-arm64
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Job 4：Windows x64 编译（原生）
  # ──────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build pw (windows-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取 CLI 版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' "${CLI_PKG_DIR}/pubspec.yaml" | awk '{print $2}')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_VERSION="${VERSION}+${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 安装依赖（workspace 根）
        shell: bash
        run: |
          cd "${WORKSPACE_DIR}"
          dart pub get --no-precompile

      - name: 编译 windows-x64
        shell: bash
        run: |
          mkdir -p build/cli
          dart compile exe "${CLI_PKG_DIR}/bin/patchwing.dart" \
            -o "${{ github.workspace }}/build/cli/pw-windows-x64.exe" \
            -D PATCHWING_BUILD_VERSION=${{ steps.version.outputs.build_version }}

      - name: 上传 windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: pw-windows-x64.exe
          path: build/cli/pw-windows-x64.exe
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Job 5：发布到 MinIO CDN
  # 仅在手动触发或 v* tag 推送时执行；普通 push 仅编译验证
  # ──────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to MinIO
    needs: [build-macos, build-linux-x64, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取 CLI 版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' "${CLI_PKG_DIR}/pubspec.yaml" | awk '{print $2}')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_VERSION="${VERSION}+${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 CLI Version: ${VERSION}"
          echo "🔖 Build Version: ${BUILD_VERSION}"

      - name: 下载所有平台 artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 列出产物
        shell: bash
        run: |
          echo "=== 编译产物 ==="
          find artifacts/ -type f | sort
          echo ""
          find artifacts/ -type f -exec ls -lh {} \;

      - name: 安装 MinIO Client (mc)
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc --version

      - name: 配置 MinIO alias
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          mc alias set patchwing "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"

      - name: 上传到 MinIO（versioned + latest）
        env:
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET || 'patchwing' }}
          VERSION: ${{ steps.version.outputs.version }}
          UPLOAD_LATEST: ${{ github.event.inputs.upload_latest }}
        shell: bash
        run: |
          set -euo pipefail
          # 确保 bucket 存在
          mc mb --ignore-existing "patchwing/${MINIO_BUCKET}"

          UPLOADED=0
          for dir in artifacts/pw-*/; do
            for bin_file in "${dir}"pw-*; do
              [ -f "$bin_file" ] || continue
              FILENAME=$(basename "$bin_file")
              echo "→ Upload: ${FILENAME} → cli/${VERSION}/"
              mc cp "$bin_file" "patchwing/${MINIO_BUCKET}/cli/${VERSION}/${FILENAME}"

              # 默认同步到 latest；workflow_dispatch 时若显式传 false 则跳过
              if [ "${UPLOAD_LATEST:-true}" != "false" ]; then
                echo "→ Upload: ${FILENAME} → cli/latest/"
                mc cp "$bin_file" "patchwing/${MINIO_BUCKET}/cli/latest/${FILENAME}"
              fi
              UPLOADED=$((UPLOADED + 1))
            done
          done
          echo ""
          echo "✅ 共上传 ${UPLOADED} 个文件"

          # ---- 写入 version.txt（供 pw 自身和 install 脚本做版本检查使用）----
          # 内容必须与编译时通过 -D PATCHWING_BUILD_VERSION 注入的字符串一致，
          # 即 "<pubspec_version>+<short_sha>"，pw 端 isLatest() 会做精确字符串比对。
          BUILD_VERSION="${VERSION}+$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo -n "${BUILD_VERSION}" > /tmp/version.txt
          echo "→ Upload: version.txt (= ${BUILD_VERSION}) → cli/${VERSION}/ & cli/latest/"
          mc cp /tmp/version.txt "patchwing/${MINIO_BUCKET}/cli/${VERSION}/version.txt"
          if [ "${UPLOAD_LATEST:-true}" != "false" ]; then
            mc cp /tmp/version.txt "patchwing/${MINIO_BUCKET}/cli/latest/version.txt"
          fi

          # ---- 上传 bin/internal/*.version（shorebird 同构：与 pw 二进制配套分发）----
          # pw 启动时会读取 <patchwingRoot>/bin/internal/{engine,flutter}.version 来锁定
          # 魔改后的 flutter SDK / engine 的 commit。这两个文件由仓库内固化，必须随
          # 二进制一起发到 CDN，由 install.sh / install.ps1 下载到 ~/.patchwing/bin/internal/。
          INTERNAL_DIR="bin/internal"
          for vfile in engine.version flutter.version; do
            SRC="${INTERNAL_DIR}/${vfile}"
            if [ ! -f "${SRC}" ]; then
              echo "❌ 仓库缺少 ${SRC}，无法继续发布。请先在仓库中固化该文件。"
              exit 1
            fi
            echo "→ Upload: ${vfile} (= $(cat "${SRC}")) → cli/${VERSION}/internal/ & cli/latest/internal/"
            mc cp "${SRC}" "patchwing/${MINIO_BUCKET}/cli/${VERSION}/internal/${vfile}"
            if [ "${UPLOAD_LATEST:-true}" != "false" ]; then
              mc cp "${SRC}" "patchwing/${MINIO_BUCKET}/cli/latest/internal/${vfile}"
            fi
          done

      - name: 打印 CDN 下载地址
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          echo ""
          echo "✅ Published Patchwing CLI v${VERSION}"
          echo ""
          echo "Versioned URLs:"
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64.exe; do
            echo "  https://cdn.patchwing.net/patchwing/cli/${VERSION}/pw-${p}"
          done
          echo ""
          echo "Latest URLs:"
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64.exe; do
            echo "  https://cdn.patchwing.net/patchwing/cli/latest/pw-${p}"
          done

      - name: 构建结果汇总
        shell: bash
        run: |
          echo "## 🛠️ Patchwing CLI v${{ steps.version.outputs.version }} 编译结果"
          echo ""
          echo "| 平台 | 状态 |"
          echo "|------|------|"
          echo "| darwin-arm64 | ${{ needs.build-macos.result }} |"
          echo "| darwin-x64   | ${{ needs.build-macos.result }} |"
          echo "| linux-x64    | ${{ needs.build-linux-x64.result }} |"
          echo "| linux-arm64  | ${{ needs.build-linux-arm64.result }} |"
          echo "| windows-x64  | ${{ needs.build-windows.result }} |"
